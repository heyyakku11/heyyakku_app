org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Enable AGP built-in Kotlin (Flutter 3.47+).
# Plugins must independently migrate away from applying KGP.
android.builtInKotlin=true
# Avoid Kotlin incremental-cache double-register on Windows when plugin sources
# live on C: (Pub cache) and the project build dir is on D:.
kotlin.incremental=false
